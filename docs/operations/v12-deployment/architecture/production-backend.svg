<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="800" viewBox="0 0 1320 800" role="img" aria-labelledby="title desc">
  <title id="title">v12 生产后端常驻架构</title>
  <desc id="desc">2026年11月18日实测。生产服务器上的 FastAPI、Redis、Nacos 和本机 DEK 文件，外部依赖为阿里云 RDS。拟上线的 Vercel 代理与 HTTPS 网关使用虚线标识。</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#547584"/>
    </marker>
    <marker id="plan-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0 0L8 4L0 8Z" fill="#a5662c"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; fill: #172e37; }
      .heading { font-size: 35px; font-weight: 700; }
      .subtitle { font-size: 16px; fill: #4c6570; }
      .label { font-size: 14px; font-weight: 700; letter-spacing: 1px; fill: #446775; }
      .title { font-size: 20px; font-weight: 700; }
      .compact { font-size: 18px; }
      .body { font-size: 15px; fill: #395763; }
      .small { font-size: 13px; fill: #435f69; }
      .line { fill: none; stroke: #547584; stroke-width: 2; marker-end: url(#arrow); }
      .planline { fill: none; stroke: #a5662c; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#plan-arrow); }
      .card { fill: #ffffff; stroke: #c5d5d9; stroke-width: 1.3; }
      .plan { fill: #fff8e9; stroke: #be894f; stroke-width: 1.3; stroke-dasharray: 6 5; }
      .warm { fill: #845019; }
    </style>
  </defs>

  <rect width="1320" height="800" fill="#f6f8f6"/>
  <path d="M42 47V106" stroke="#18756c" stroke-width="5"/>
  <text x="57" y="74" class="heading">v12 生产后端常驻架构</text>
  <text x="57" y="105" class="subtitle">2026-11-18 · 生产主机与数据库经只读核对</text>
  <path d="M1002 64h30" stroke="#547584" stroke-width="2"/>
  <text x="1042" y="70" class="small">已运行</text>
  <path d="M1125 64h30" stroke="#a5662c" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="1165" y="70" class="small">拟接入</text>

  <rect x="42" y="143" width="257" height="531" rx="15" fill="#f0f3ef" stroke="#d8e0d9"/>
  <text x="63" y="173" class="label">公网 → 生产应用</text>

  <rect x="62" y="193" width="216" height="105" rx="11" class="plan"/>
  <text x="79" y="223" class="title compact warm">Vercel v12 同源代理</text>
  <text x="79" y="251" class="body">投票 /v12-be/*</text>
  <text x="79" y="275" class="body">结果 /res-be/*</text>
  <path d="M170 299v29" class="planline"/>
  <rect x="62" y="329" width="216" height="90" rx="11" class="plan"/>
  <text x="79" y="360" class="title warm">HTTPS 网关</text>
  <text x="79" y="388" class="body">api.touhou.vote:443</text>
  <text x="63" y="457" class="small">探测时 DNS 记录尚不存在，</text>
  <text x="63" y="479" class="small">结果站 API 代理待接通。</text>

  <rect x="326" y="143" width="626" height="531" rx="15" fill="#e8f0ed" stroke="#a9c2bd" stroke-width="1.5"/>
  <text x="348" y="172" class="label">生产主机</text>
  <text x="348" y="201" class="body">Docker Compose · /opt/thvote/prod</text>
  <rect x="347" y="225" width="584" height="322" rx="13" fill="#f7faf8" stroke="#b6cbc5"/>
  <text x="367" y="254" class="label">容器网络 thvote-net</text>

  <rect x="367" y="285" width="273" height="181" rx="11" fill="#e2f3ee" stroke="#80afa6" stroke-width="1.4"/>
  <text x="386" y="319" class="title">thvote-backend</text>
  <text x="386" y="347" class="body">FastAPI · GraphQL / REST</text>
  <text x="386" y="373" class="body">主机 :18000 → 容器 :8000</text>
  <text x="386" y="400" class="body">镜像 ID 0d5022cde4cf</text>
  <text x="386" y="427" class="body">Alembic 0022 · /health 正常</text>
  <path d="M279 373h84" class="planline"/>

  <rect x="699" y="271" width="211" height="103" rx="11" class="card"/>
  <text x="716" y="302" class="title">thvote-redis</text>
  <text x="716" y="329" class="body">:6379 · 缓存、限流、验证</text>
  <text x="716" y="352" class="small">仅容器网络访问</text>
  <path d="M641 323h54" class="line"/>
  <rect x="699" y="394" width="211" height="126" rx="11" class="card"/>
  <text x="716" y="425" class="title compact">mynacos · R-Nacos</text>
  <text x="716" y="451" class="body">:8848 · 生产业务配置</text>
  <text x="716" y="475" class="small">thvote-prod / thvote_be</text>
  <text x="716" y="496" class="small">控制台端口绑定 127.0.0.1</text>
  <path d="M641 434h54" class="line"/>
  <text x="368" y="520" class="small">依赖由 docker-compose.deps.yml 独立维护</text>

  <rect x="367" y="565" width="543" height="84" rx="11" class="card"/>
  <text x="387" y="596" class="title">宿主持久化</text>
  <text x="387" y="624" class="body">secrets/pii_dek 只读挂载（0400） · logs/ · Redis / Nacos 数据</text>
  <path d="M392 565v-24h-36v-95h8" class="line"/>

  <text x="979" y="173" class="label">托管数据库与发布</text>
  <path d="M640 384h487v-12" class="line"/>
  <text x="978" y="407" class="small">PostgreSQL :5432</text>

  <rect x="978" y="198" width="300" height="171" rx="11" class="card"/>
  <text x="997" y="234" class="title">阿里云 RDS PostgreSQL</text>
  <text x="997" y="262" class="body">18.3 · prod_db · 当前写主</text>
  <text x="997" y="288" class="body">连接配置由生产 Nacos 下发</text>
  <text x="997" y="320" class="small">控制台待复核主备系列、</text>
  <text x="997" y="342" class="small">备份策略和可恢复时间窗口</text>

  <rect x="978" y="470" width="300" height="179" rx="11" class="card"/>
  <text x="997" y="505" class="title">GitHub Actions → GHCR</text>
  <text x="997" y="534" class="body">main 推送自动部署测试</text>
  <text x="997" y="558" class="body">生产需手动开启 deploy_prod</text>
  <text x="997" y="582" class="body">复用当次测试验证的镜像 digest</text>
  <text x="997" y="610" class="small">执行 Alembic 后重建后端容器</text>
  <path d="M977 550H956" class="line"/>

  <rect x="42" y="707" width="1236" height="52" rx="10" fill="#edf2ef"/>
  <text x="62" y="739" class="body">阿里云生产备池待建。测试环境独立运行；旧版 v9/v10/v11 使用历史入口。</text>
</svg>
